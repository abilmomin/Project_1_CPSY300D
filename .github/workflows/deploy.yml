name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install packages
        run: |
          pip install pandas matplotlib seaborn

      - name: Run Python script
        run: |
          python data_analysis.py

